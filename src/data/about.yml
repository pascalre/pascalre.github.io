# Tiles in the "About me" section.
# color: sun | mint | rose | sky | lilac      size: wide | tall | normal
# The grid has 4 columns: order tiles so each row adds up to 4 (wide = 2).
#
# Photo tiles: set `photo` to a file in src/assets/photos/. The photo fills the
# tile and title/text are shown on top of it. Without title and text it is a
# pure photo tile. `alt` describes the photo for screen readers, `position`
# moves the crop (e.g. "50% 25%" keeps faces in view). Until the file exists,
# `npm run dev` shows a placeholder and the live site skips pure photo tiles.
